<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة القروض البنكية</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --container-bg: #161b22;
            --border-gold: #c9d1d9;
            --accent-gold: #f0f6fc;
            --text-color: #c9d1d9;
            --input-bg: #0d1117;
            --btn-bg: #21262d;
            --btn-text: #f0f6fc;
            --table-header: #30363d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background-color: var(--container-bg);
            border: 2px solid var(--border-gold);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h1, h2 {
            text-align: center;
            color: var(--accent-gold);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--accent-gold);
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-gold);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            text-align: right;
        }

        input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 5px rgba(88, 166, 255, 0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid var(--border-gold);
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #30363d;
        }

        .results {
            margin-top: 25px;
            padding: 15px;
            background-color: var(--input-bg);
            border-radius: 8px;
            border: 1px solid var(--border-gold);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .result-value {
            font-weight: bold;
            color: var(--accent-gold);
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            border: 1px solid var(--border-gold);
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: var(--table-header);
            color: var(--accent-gold);
        }

        .hidden {
            display: none;
        }

        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #8b949e;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>حاسبة القروض البنكية</h1>
    
    <div class="form-group">
        <label>قيمة القرض (جنيه):</label>
        <input type="number" id="loan-amount" placeholder="أدخل مبلغ القرض">
    </div>

    <div class="form-group">
        <label>سعر الفائدة السنوية (%):</label>
        <input type="number" step="0.01" id="interest-rate" placeholder="أدخل نسبة الفائدة">
    </div>

    <div class="form-group">
        <label>مدة القرض (بالسنوات):</label>
        <input type="number" id="loan-term" placeholder="أدخل عدد السنوات">
    </div>

    <button onclick="calculateLoan()">احسب القسط</button>

    <div id="results-section" class="results hidden">
        <h2>نتائج الحساب</h2>
        <div class="result-item">
            <span>القسط الشهري:</span>
            <span id="res-monthly" class="result-value">0</span>
        </div>
        <div class="result-item">
            <span>إجمالي الفوائد:</span>
            <span id="res-total-interest" class="result-value">0</span>
        </div>
        <div class="result-item">
            <span>إجمالي المبلغ المدفوع:</span>
            <span id="res-total-paid" class="result-value">0</span>
        </div>
    </div>

    <div class="footer-note">
        إعداد أ/ طارق متولى
    </div>
</div>

<script>
    function calculateLoan() {
        const principal = parseFloat(document.getElementById('loan-amount').value);
        const annualRate = parseFloat(document.getElementById('interest-rate').value);
        const years = parseInt(document.getElementById('loan-term').value);

        if (isNaN(principal) || isNaN(annualRate) || isNaN(years) || principal <= 0 || annualRate < 0 || years <= 0) {
            alert('الرجاء إدخال بيانات صحيحة في جميع الحقول.');
            return;
        }

        const monthlyRate = (annualRate / 100) / 12;
        const totalMonths = years * 12;

        let monthlyPayment = 0;
        if (monthlyRate === 0) {
            monthlyPayment = principal / totalMonths;
        } else {
            monthlyPayment = (principal * monthlyRate * Math.pow(1 + monthlyRate, totalMonths)) / (Math.pow(1 + monthlyRate, totalMonths) - 1);
        }

        const totalPaid = monthlyPayment * totalMonths;
        const totalInterest = totalPaid - principal;

        document.getElementById('res-monthly').innerText = monthlyPayment.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' جنيه';
        document.getElementById('res-total-interest').innerText = totalInterest.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' جنيه';
        document.getElementById('res-total-paid').innerText = totalPaid.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' جنيه';

        document.getElementById('results-section').classList.remove('hidden');
    }
</script>

</body>
</html>
