<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة القروض البنكية</title>
    <!-- استدعاء سكريبت جوجل لإعلانات البنر -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-app-pub-4957378617452523~7270351395" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #111418;
            --text-color: #e6edf3;
            --gold-color: #d4af37;
            --border-color: #2b313b;
            --btn-red: #8b0000;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--gold-color);
            box-shadow: 0 6px 20px rgba(0,0,0,0.8);
            text-align: center;
        }
        .header-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 5px;
        }
        .sub-title {
            font-size: 16px;
            color: var(--gold-color);
            margin-bottom: 20px;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--text-color);
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: #050505;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 16px;
            text-align: right;
        }
        input:focus {
            border-color: var(--gold-color);
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-calc {
            background-color: var(--gold-color);
            color: #000;
        }
        .btn-reset {
            background-color: var(--btn-red);
            color: #fff;
        }
        button:hover {
            opacity: 0.9;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #050505;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: right;
        }
        .result p {
            margin: 8px 0;
            font-size: 15px;
        }
        .table-container {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: center;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 6px;
        }
        th {
            background-color: #1a202c;
            color: var(--gold-color);
        }
        .footer-info {
            margin-top: 20px;
            font-size: 12px;
            color: #8b949e;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }
        .footer-info div {
            margin: 5px 0;
        }
        .footer-info a {
            color: var(--gold-color);
            text-decoration: none;
            margin: 0 5px;
        }
        .banner-container {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">جروب عملاء البنوك المصرية</div>
        <div class="sub-title">حاسبة القروض البنكية</div>
        
        <div class="form-group">
            <label>قيمة القرض (جنيه)</label>
            <input type="number" id="loanAmount" placeholder="أدخل مبلغ القرض">
        </div>
        
        <div class="form-group">
            <label>نسبة الفائدة السنوية %</label>
            <input type="number" id="interestRate" placeholder="نسبة الفائدة" step="0.01">
        </div>
        
        <div class="form-group">
            <label>مدة القرض بالسنوات</label>
            <input type="number" id="loanYears" placeholder="عدد السنوات">
        </div>

        <div class="form-group">
            <label>رقم الشهر للسداد المبكر (اختياري)</label>
            <input type="number" id="earlyMonth" placeholder="مثال: الشهر رقم 12">
        </div>
        
        <button class="btn-calc" onclick="calculateLoan()">احسب القرض والأقساط</button>
        <button class="btn-reset" onclick="resetForm()">إدخال جديد</button>
        
        <div class="result" id="resultDiv" style="display: none;">
            <p><strong>قسط الشهر:</strong> <span id="monthlyPayment">0</span> جنيه</p>
            <p><strong>إجمالي الفوائد:</strong> <span id="totalInterest">0</span> جنيه</p>
            <p><strong>إجمالي المبلغ المستحق:</strong> <span id="totalPayment">0</span> جنيه</p>
            <div id="earlyResult" style="margin-top: 10px; color: var(--gold-color); font-weight: bold;"></div>
            
            <div style="margin-top: 15px; font-weight: bold; text-align: center; color: var(--gold-color);">جدول الأقساط الشهرية</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>الشهر</th>
                            <th>القصط</th>
                            <th>الفوائد</th>
                            <th>الأصل المتبقي</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody">
                        <!-- جدول الأقساط -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="footer-info">
            <div>إعداد أ/ طارق متولى</div>
            <div>
                <a href="#">سياسة الخصوصية</a> | <a href="#">دليل حاسبة القروض</a>
            </div>
        </div>

        <!-- مكان إعلان البنر المدمج برقم الوحدة الخاص بك -->
        <div class="banner-container">
            <ins class="adsbygoogle"
                 style="display:inline-block;width:320px;height:50px"
                 data-ad-client="ca-app-pub-4957378617452523"
                 data-ad-slot="4775301562"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>

    <script>
        function calculateLoan() {
            const principal = parseFloat(document.getElementById('loanAmount').value);
            const annualRate = parseFloat(document.getElementById('interestRate').value);
            const years = parseFloat(document.getElementById('loanYears').value);
            const earlyMonthInput = parseInt(document.getElementById('earlyMonth').value);

            if (isNaN(principal) || isNaN(annualRate) || isNaN(years) || principal <= 0 || annualRate < 0 || years <= 0) {
                alert('الرجاء إدخال بيانات صحيحة وسليمة للقرض');
                return;
            }

            const monthlyRate = (annualRate / 100) / 12;
            const numberOfPayments = years * 12;
            
            let monthlyPayment = 0;
            if (monthlyRate === 0) {
                monthlyPayment = principal / numberOfPayments;
            } else {
                monthlyPayment = (principal * monthlyRate * Math.pow(1 + monthlyRate, numberOfPayments)) / 
                                 (Math.pow(1 + monthlyRate, numberOfPayments) - 1);
            }

            const totalPayment = monthlyPayment * numberOfPayments;
            const totalInterest = totalPayment - principal;

            document.getElementById('monthlyPayment').innerText = monthlyPayment.toFixed(2);
            document.getElementById('totalInterest').innerText = totalInterest.toFixed(2);
            document.getElementById('totalPayment').innerText = totalPayment.toFixed(2);

            // حساب جدول الأقساط والسداد المبكر
            let balance = principal;
            let scheduleHTML = '';
            let earlyBalanceText = '';

            for (let i = 1; i <= numberOfPayments; i++) {
                let interestPayment = balance * monthlyRate;
                let principalPayment = monthlyPayment - interestPayment;
                balance -= principalPayment;
                if (balance < 0) balance = 0;

                scheduleHTML += `<tr>
                    <td>${i}</td>
                    <td>${monthlyPayment.toFixed(0)}</td>
                    <td>${interestPayment.toFixed(0)}</td>
                    <td>${balance.toFixed(0)}</td>
                </tr>`;

                if (!isNaN(earlyMonthInput) && earlyMonthInput === i) {
                    earlyBalanceText = `المبلغ المتبقي للسداد المبكر بنهاية الشهر ${i}: ${balance.toFixed(2)} جنيه`;
                }
            }

            document.getElementById('scheduleBody').innerHTML = scheduleHTML;
            document.getElementById('earlyResult').innerText = earlyBalanceText;
            document.getElementById('resultDiv').style.display = 'block';
        }

        function resetForm() {
            document.getElementById('loanAmount').value = '';
            document.getElementById('interestRate').value = '';
            document.getElementById('loanYears').value = '';
            document.getElementById('earlyMonth').value = '';
            document.getElementById('resultDiv').style.display = 'none';
        }
    </script>

</body>
</html>
